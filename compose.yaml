services:
  db:
    image: postgres:16
    container_name: nutriguide_db
    environment:
      POSTGRES_DB: nutriguide
      POSTGRES_USER: nutriguide_user
      POSTGRES_PASSWORD: nutriguide_pass
    ports:
      - "5432:5432"
    volumes:
      - nutriguide_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: nutriguide_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  nutriguide_data: